# The web tool and the Python reference: both against the test vectors and a
# simulated acoustic channel; then the web tool built (its SHA-256 printed)
# and, on main, published on GitHub Pages. Runs only when the web tool or
# what it is checked against changes; release.yml calls it for every version
# tag (without publishing).
name: web-tool

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "reference/**"
      - "vectors/**"
      - "tests/test_reference.py"
      - "tests/acoustic.py"
      - "docs/images/**"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "reference/**"
      - "vectors/**"
      - "tests/test_reference.py"
      - "tests/acoustic.py"
      - "docs/images/**"
      - ".github/workflows/web.yml"
  workflow_call:

permissions:
  contents: read

jobs:
  tests-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Python reference against the vectors (and audio)
        run: python3 tests/test_reference.py
      - name: JavaScript against the vectors (and audio)
        run: node web/test.mjs
      - name: Build the web tool
        run: node web/build.mjs
      - name: The site for GitHub Pages
        run: mkdir site && cp dist/ur-tones.html site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: tests-and-build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
