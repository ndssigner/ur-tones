# Tests the reference implementation and the web tool against the test
# vectors, builds the web tool and the release zip (reproducible: compare the
# printed SHA-256 with a local build of the same commit). On main, publishes
# the web tool on GitHub Pages; on a version tag (v*), drafts a release.
name: test-and-build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0    # tests/test_c_layers.py builds the library of 148c6f7 to compare with
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Python reference against the vectors (and audio)
        run: python3 tests/test_reference.py
      - name: C library against the vectors and the reference (and audio)
        run: python3 tests/test_c.py
      - name: C library, multi-part URs and keys, with integers and with doubles
        run: python3 tests/test_c_multipart.py
      - name: C library, its configuration, layers and hooks
        run: python3 tests/test_c_layers.py
      - name: C library uses no floating point by default (CPUs without an FPU)
        run: cc -std=c99 -Wall -Werror -mgeneral-regs-only -c c/ur_tones.c -o /dev/null
      - name: JavaScript against the vectors (and audio)
        run: node web/test.mjs
      - name: Build the web tool
        run: node web/build.mjs
      - name: Bundle (tag name, or dev-<commit> between releases)
        run: |
          case "$GITHUB_REF" in refs/tags/v*) v="$GITHUB_REF_NAME" ;; *) v="dev-$(echo "$GITHUB_SHA" | cut -c1-12)" ;; esac
          python3 tools/bundle.py "$v"
      - uses: actions/upload-artifact@v7
        with:
          name: ur-tones
          path: |
            dist/ur-tones-*.zip
            dist/SHA256SUMS
      - name: The site for GitHub Pages
        run: mkdir site && cp dist/ur-tones.html site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  portability:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Arm's own toolchain, checked by its SHA-256 and cached: apt's packages
      # took over 10 minutes to install.
      - id: arm-cache
        uses: actions/cache@v4
        with:
          path: ~/arm-gnu-toolchain
          key: arm-gnu-toolchain-14.3.rel1-x86_64
      - name: Arm GNU Toolchain for the Cortex-M0+
        if: steps.arm-cache.outputs.cache-hit != 'true'
        run: |
          f=arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz
          curl -fsSL -o "$f" "https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/$f"
          echo "8f6903f8ceb084d9227b9ef991490413014d991874a1e34074443c2a72b14dbd  $f" | sha256sum -c -
          mkdir -p ~/arm-gnu-toolchain
          tar -xJf "$f" -C ~/arm-gnu-toolchain --strip-components=1
      - run: echo "$HOME/arm-gnu-toolchain/bin" >> "$GITHUB_PATH"
      - name: C library for the RP2040 (Cortex-M0+), warnings as errors; its sizes
        run: tools/portability.sh m0plus
      - name: C library for the Nintendo DSi (ARM946E-S), warnings as errors; its sizes
        run: tools/portability.sh arm946
      - uses: actions/checkout@v7
        with:
          repository: raspberrypi/pico-sdk
          ref: "2.3.1"
          path: pico-sdk
      - name: The Pico example (examples/pico)
        run: |
          git -C pico-sdk submodule update --init --depth 1 lib/tinyusb   # USB serial; the rest is for radios
          cmake -S examples/pico -B build/pico -DPICO_SDK_PATH="$PWD/pico-sdk"
          cmake --build build/pico -j "$(nproc)"
          ls -l build/pico/ur_tones_pico.uf2

  pages:
    if: github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ur-tones
      - name: Draft release (published by hand after checking the hash)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ur-tones-*.zip SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --draft --prerelease \
            --title "ur-tones $GITHUB_REF_NAME" \
            --notes "Web tool (EN/ES) and specification. Draft: test seeds and testnet PSBTs only. Verify: sha256sum -c SHA256SUMS"
