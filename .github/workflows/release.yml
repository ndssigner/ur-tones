# A version tag (v*): every test (c.yml and web.yml, whatever changed), then
# the release zip (reproducible: compare the printed SHA-256 with a local
# build of the same commit) and a draft pre-release, published by hand after
# checking the hash. Run by hand on a branch, it does the same without the
# release: a check before tagging.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c-library:
    uses: ./.github/workflows/c.yml
  web-tool:
    uses: ./.github/workflows/web.yml
    permissions:    # what its pages job asks for; it does not run on a tag
      contents: read
      pages: write
      id-token: write

  bundle:
    needs: [c-library, web-tool]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Build the web tool
        run: node web/build.mjs
      - name: Bundle (tag name, or dev-<commit> when run by hand)
        run: |
          case "$GITHUB_REF" in refs/tags/v*) v="$GITHUB_REF_NAME" ;; *) v="dev-$(echo "$GITHUB_SHA" | cut -c1-12)" ;; esac
          python3 tools/bundle.py "$v"
      - uses: actions/upload-artifact@v7
        with:
          name: ur-tones
          path: |
            dist/ur-tones-*.zip
            dist/SHA256SUMS

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ur-tones
      - name: Draft release (published by hand after checking the hash)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ur-tones-*.zip SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --draft --prerelease \
            --title "ur-tones $GITHUB_REF_NAME" \
            --notes "Web tool (EN/ES) and specification. Draft: test seeds and testnet PSBTs only. Verify: sha256sum -c SHA256SUMS"
